stages:
- stage: A
  jobs:
  - job: JobA1
    steps:
    - script: echo "This is JobA1"

  - job: JobA2
    steps:
    - script: echo "This is JobA2"

- stage: B
  jobs:
  - job: JobB1
    dependsOn: A.JobA1  # depends on a job in stage A
    steps:
    - script: echo "This is JobB1, which depends on JobA1"

  - job: JobB2
    steps:
    - script: echo "This is JobB2, which runs in parallel with JobA1"
